<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin e Padding</title>
    <!-- Margin é o espaçamento de fora -->
    <!-- Padding é o espaçamento de dentro -->
    <style>
      div {
        border: 2px solid orange;
        width: 700px;
        padding: 50px;
        margin: 0 auto; /*dessa forma o div fica centralizado */
      }
      h1 {
        border: 2px solid blue;
        margin: 0px;
        padding: 10px;
      }
      p {
        border: 2px solid green;
        margin: 0px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Explicação de Margin e Padding</h1>

      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae veritatis
        nobis repellendus exercitationem, tempora omnis quibusdam eaque neque.
        Quos ducimus neque, in similique adipisci quidem earum tenetur maxime
        asperiores natus!
      </p>
    </div>
  </body>
</html>
